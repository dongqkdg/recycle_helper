<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>분리수거 분류기</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><div class="eyebrow">ECO SORT · LOCAL AI</div><h1>쓰레기 분류를<br><em>더 쉽게</em></h1><p class="lead">사진을 올리면 재활용 종류와 배출 방법을 안내해 드려요.</p>
<section class="card"><label class="drop" for="file"><span class="icon">＋</span><strong>이미지를 선택하세요</strong><small>JPG, PNG, WEBP · 최대 10MB</small><input id="file" type="file" accept="image/*"></label><div id="preview-wrap" class="preview hidden"><img id="preview"><button id="clear">다시 선택</button></div><button id="analyze" disabled>분류 시작하기 <span>→</span></button><p id="error" class="error"></p></section>
<section id="result" class="result hidden"><div class="result-top"><span>ANALYSIS RESULT</span><span id="model"></span></div><h2 id="category"></h2><p id="confidence"></p><div class="guide"><b>♻ 분리수거 방법</b><p id="guide"></p></div></section><p class="notice">AI 분석 결과는 추정치입니다. 실제 배출 전 반드시 거주 지역의 지자체 분리수거 규정을 확인하세요.</p></main><script src="/static/app.js"></script></body></html>
