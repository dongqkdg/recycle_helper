name: Build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/recycle-helper

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Evaluate fixed model-update dataset
        run: |
          python -m pip install -r ml_requirements.txt
          python evaluate_model_update.py

      - name: Upload model evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-${{ github.sha }}
          path: model-evaluation/
          if-no-files-found: warn

      - name: Add model comparison to job summary
        if: always()
        run: |
          if [ -f model-evaluation/summary.md ]; then
            cat model-evaluation/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build image and run model smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
